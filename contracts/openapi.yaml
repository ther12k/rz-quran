components:
  securitySchemes:
    adultSession:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: Logical auth-session cookie; exact production prefix/name is chosen by the pinned auth
        library. Also enforce mode, gate, consent, ownership and staff MFA as applicable.
  schemas:
    AuthoringVerseRef:
      type: object
      additionalProperties: false
      properties:
        source_id:
          type: string
          format: uuid
        verse_key:
          type: string
          pattern: ^[1-9][0-9]{0,2}:[1-9][0-9]{0,2}$
      required:
      - source_id
      - verse_key
    AuthoringOption:
      type: object
      additionalProperties: false
      properties:
        option_id:
          type: string
          pattern: ^[a-z0-9][a-z0-9_-]{0,31}$
        label:
          type: string
          minLength: 1
          maxLength: 80
      required:
      - option_id
      - label
    AuthoringUnit:
      type: object
      additionalProperties: false
      properties:
        unit_id:
          type: string
          format: uuid
        ordinal:
          type: integer
          minimum: 1
        unit_type:
          type: string
          enum:
          - instruction
          - letter
          - ayah
          - choice
        required:
          type: boolean
        instruction:
          type: string
          minLength: 1
          maxLength: 240
        letter:
          type: string
          minLength: 1
          maxLength: 16
        verse_ref:
          $ref: '#/components/schemas/AuthoringVerseRef'
        audio_asset_id:
          anyOf:
          - type: string
            format: uuid
